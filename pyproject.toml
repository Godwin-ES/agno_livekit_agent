[project]
name = "livekit-agent"
version = "0.1.0"
description = "LiveKit Voice Agent with Agno Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.4.7",
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,openai,silero]~=1.3",
    "livekit-plugins-noise-cancellation>=0.2.5",
    "livekit-plugins-turn-detector>=1.3.12",
    "lxml-html-clean>=0.4.5",
    "newspaper4k>=0.9.6",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.46",
    "wikipedia>=1.4.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
